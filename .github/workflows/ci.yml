name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  docker:
    name: docker build & smoke test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: auto-sof:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name auto-sof -p 8501:8501 auto-sof:ci

      - name: Wait for Streamlit health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health | grep -q ok; then
              echo "healthy after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"; docker logs auto-sof; exit 1

      - name: Smoke-test the app UI
        run: |
          # The main page must render HTML, not an error
          page=$(curl -fsS http://localhost:8501/)
          echo "$page" | grep -qi "<html" || { echo "::error::no HTML served"; exit 1; }
          echo "app served $(echo "$page" | wc -c) bytes of HTML"

      - name: Container logs on failure
        if: failure()
        run: docker logs auto-sof

  publish:
    name: publish image to ghcr
    runs-on: ubuntu-latest
    needs: [tests, docker]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/auto-sof
          tags: |
            latest
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
